rules:
  - id: csharp-sql-injection
    patterns:
      - pattern-either:
          - pattern: |
              new SqlCommand("..." + $INPUT + "...", ...)
          - pattern: |
              new SqlCommand($"...", ...)
          - pattern: |
              $CMD.CommandText = "..." + $INPUT + "..."
          - pattern: |
              $CMD.ExecuteReader("..." + $INPUT + "...")
          - pattern: |
              $CMD.ExecuteNonQuery("..." + $INPUT + "...")
          - pattern: |
              $CMD.ExecuteScalar("..." + $INPUT + "...")
    message: >
      SQL query built with string concatenation or interpolation in
      SqlCommand. Use parameterized queries with SqlParameter
      (e.g., cmd.Parameters.AddWithValue("@name", input)) to prevent
      SQL injection.
    severity: ERROR
    languages: [csharp]
    metadata:
      cwe: ["CWE-89"]
      owasp: ["A03:2021 Injection"]
      confidence: HIGH
      impact: CRITICAL
      category: security

  # ---------------------------------------------------------------------------
  # Command Injection
  # ---------------------------------------------------------------------------
  - id: csharp-command-injection
    patterns:
      - pattern-either:
          - pattern: |
              Process.Start($CMD)
          - pattern: |
              Process.Start($CMD, $ARGS)
          - pattern: |
              new ProcessStartInfo($CMD, $ARGS)
          - pattern: |
              $PSI.Arguments = $ARGS
          - pattern: |
              $PSI.FileName = $CMD
      - metavariable-pattern:
          metavariable: $CMD
          patterns:
            - pattern-not: "..."
    message: >
      Process.Start() or ProcessStartInfo called with a potentially
      user-controlled command or arguments. Validate and sanitize all
      input, use an allowlist of permitted commands, and avoid passing
      unsanitized user data as command arguments.
    severity: ERROR
    languages: [csharp]
    metadata:
      cwe: ["CWE-78"]
      owasp: ["A03:2021 Injection"]
      confidence: HIGH
      impact: CRITICAL
      category: security

  # ---------------------------------------------------------------------------
  # Path Traversal
  # ---------------------------------------------------------------------------
  - id: csharp-xss-html-raw
    patterns:
      - pattern-either:
          - pattern: |
              Html.Raw($INPUT)
          - pattern: |
              @Html.Raw($INPUT)
      - metavariable-pattern:
          metavariable: $INPUT
          patterns:
            - pattern-not: "..."
    message: >
      Html.Raw() renders content without HTML encoding, which can lead
      to cross-site scripting (XSS) if the input contains user data.
      Use HtmlEncoder.Encode() or the default Razor encoding (@variable)
      instead. Only use Html.Raw() for trusted, pre-sanitized content.
    severity: ERROR
    languages: [csharp]
    metadata:
      cwe: ["CWE-79"]
      owasp: ["A03:2021 Injection"]
      confidence: HIGH
      impact: HIGH
      category: security

  # ---------------------------------------------------------------------------
  # Insecure Deserialization
  # ---------------------------------------------------------------------------
  - id: csharp-insecure-deserialization
    patterns:
      - pattern-either:
          - pattern: |
              new BinaryFormatter().Deserialize(...)
          - pattern: |
              $BF.Deserialize(...)
          - pattern: |
              JsonConvert.DeserializeObject<$T>($DATA, new JsonSerializerSettings { TypeNameHandling = TypeNameHandling.All })
          - pattern: |
              JsonConvert.DeserializeObject<$T>($DATA, new JsonSerializerSettings { TypeNameHandling = TypeNameHandling.Auto })
          - pattern: |
              JsonConvert.DeserializeObject<$T>($DATA, new JsonSerializerSettings { TypeNameHandling = TypeNameHandling.Objects })
          - pattern: |
              new BinaryFormatter()
          - pattern: |
              $SETTINGS.TypeNameHandling = TypeNameHandling.All
          - pattern: |
              $SETTINGS.TypeNameHandling = TypeNameHandling.Auto
          - pattern: |
              $SETTINGS.TypeNameHandling = TypeNameHandling.Objects
    message: >
      BinaryFormatter.Deserialize() or JsonConvert with unsafe
      TypeNameHandling can lead to remote code execution when processing
      untrusted data. BinaryFormatter is obsolete and should never be
      used. For JSON, use TypeNameHandling.None (default) or use
      System.Text.Json which does not support polymorphic deserialization
      by default.
    severity: ERROR
    languages: [csharp]
    metadata:
      cwe: ["CWE-502"]
      owasp: ["A08:2021 Software and Data Integrity Failures"]
      confidence: HIGH
      impact: CRITICAL
      category: security

  # ---------------------------------------------------------------------------
  # Hardcoded Credentials
  # ---------------------------------------------------------------------------
  - id: csharp-hardcoded-credentials
    patterns:
      - pattern-either:
          - pattern: |
              string $X = "...";
          - pattern: |
              const string $X = "...";
          - pattern: |
              private const string $X = "...";
          - pattern: |
              private static readonly string $X = "...";
      - metavariable-regex:
          metavariable: $X
          regex: (?i)(password|passwd|secret|api_key|apikey|token|secret_key|secretkey|credentials|connectionstring|conn_string|connstring)
    message: >
      Hardcoded credential detected in a string literal. Store secrets
      in environment variables, Azure Key Vault, the .NET Secret Manager,
      or encrypted configuration files — never in source code.
    severity: ERROR
    languages: [csharp]
    metadata:
      cwe: ["CWE-798"]
      owasp: ["A07:2021 Identification and Authentication Failures"]
      confidence: MEDIUM
      impact: HIGH
      category: security


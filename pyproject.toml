[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-sonar"
version = "1.0.1"
description = "Local privacy and proxy consistency audit for Claude Code and agent skills"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    {name = "Claude Sonar Authors"}
]
dependencies = []
keywords = ["claude", "privacy", "proxy", "dns-leak", "mihomo", "audit", "agent-skills"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/AschoofAlpha/claude-sonar"
Repository = "https://github.com/AschoofAlpha/claude-sonar"
Issues = "https://github.com/AschoofAlpha/claude-sonar/issues"
Changelog = "https://github.com/AschoofAlpha/claude-sonar/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["claude_sonar*"]

[tool.setuptools.package-data]
claude_sonar = ["resources/semgrep_rules/*.yaml", "resources/semgrep_rules/NOTICE.md"]

[tool.setuptools.data-files]
"share/claude-sonar" = ["SKILL.md", "README.md", "README.zh-CN.md", "LICENSE"]
"share/claude-sonar/assets" = ["assets/social-preview.en.jpg", "assets/social-preview.jpg"]
"share/claude-sonar/static" = ["static/panel.html"]
"share/claude-sonar/scripts" = [
    "scripts/collect_posix_network.py",
    "scripts/collect_windows_network.ps1",
    "scripts/remediate_posix_network.py",
    "scripts/remediate_windows_network.ps1",
]
"share/claude-sonar/claude_sonar/resources" = [
    "claude_sonar/resources/known_baseurl_blacklist.txt",
]

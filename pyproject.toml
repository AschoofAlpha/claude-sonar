[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anti-claude-check"
version = "1.2.0"
description = "Local privacy and proxy consistency audit skill"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    {name = "Anti Claude Check Authors"}
]
dependencies = []

[project.urls]
Homepage = "https://github.com/AschoofAlpha/claude-shield"
Repository = "https://github.com/AschoofAlpha/claude-shield"
Issues = "https://github.com/AschoofAlpha/claude-shield/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["claude_shield*"]

[tool.setuptools.data-files]
"share/anti-claude-check" = ["SKILL.md", "README.md", "README.zh-CN.md", "LICENSE"]
"share/anti-claude-check/assets" = ["assets/social-preview.en.jpg", "assets/social-preview.jpg"]
"share/anti-claude-check/scripts" = [
    "scripts/collect_posix_network.sh",
    "scripts/collect_windows_network.ps1",
    "scripts/remediate_posix_network.sh",
    "scripts/remediate_windows_network.ps1",
]

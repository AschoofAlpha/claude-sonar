rules:
  - id: php-sql-injection-mysql-query
    patterns:
      - pattern-either:
          - pattern: |
              mysql_query("..." . $INPUT . "...")
          - pattern: |
              mysqli_query($CONN, "..." . $INPUT . "...")
          - pattern: |
              $CONN->query("..." . $INPUT . "...")
          - pattern: |
              $PDO->query("..." . $INPUT . "...")
    message: >
      SQL query built with string concatenation. Use prepared statements
      with bound parameters (PDO::prepare or mysqli::prepare).
    severity: ERROR
    languages: [php]
    metadata:
      cwe: "CWE-89"
      owasp: "A03:2021 Injection"
      confidence: HIGH
      impact: CRITICAL
      category: security
  - id: php-xss-echo-get-post
    patterns:
      - pattern-either:
          - pattern: |
              echo $_GET[$KEY];
          - pattern: |
              echo $_POST[$KEY];
          - pattern: |
              echo $_REQUEST[$KEY];
          - pattern: |
              print $_GET[$KEY];
          - pattern: |
              print $_POST[$KEY];
          - pattern: |
              print $_REQUEST[$KEY];
    message: >
      User input from superglobals echoed directly to the page without
      encoding. Use htmlspecialchars($input, ENT_QUOTES, 'UTF-8') to
      prevent cross-site scripting.
    severity: ERROR
    languages: [php]
    metadata:
      cwe: "CWE-79"
      owasp: "A03:2021 Injection"
      confidence: HIGH
      impact: HIGH
      category: security
  - id: php-command-injection
    patterns:
      - pattern-either:
          - pattern: |
              exec($INPUT, ...)
          - pattern: |
              system($INPUT)
          - pattern: |
              passthru($INPUT)
          - pattern: |
              shell_exec($INPUT)
          - pattern: |
              popen($INPUT, ...)
          - pattern: |
              proc_open($INPUT, ...)
      - pattern-not: |
          exec("...", ...)
      - pattern-not: |
          system("...")
      - pattern-not: |
          passthru("...")
      - pattern-not: |
          shell_exec("...")
    message: >
      Shell command executed with dynamic input. Use escapeshellarg()
      and escapeshellcmd() on all user-supplied values, or avoid shell
      execution entirely.
    severity: ERROR
    languages: [php]
    metadata:
      cwe: "CWE-78"
      owasp: "A03:2021 Injection"
      confidence: HIGH
      impact: CRITICAL
      category: security
  - id: php-unserialize
    patterns:
      - pattern: |
          unserialize($INPUT)
      - pattern-not: |
          unserialize("...")
    message: >
      unserialize() with untrusted data can lead to object injection and
      remote code execution. Use json_decode() for data interchange or
      restrict allowed classes with the second parameter.
    severity: ERROR
    languages: [php]
    metadata:
      cwe: "CWE-502"
      owasp: "A08:2021 Software and Data Integrity Failures"
      confidence: HIGH
      impact: CRITICAL
      category: security

  # ---------------------------------------------------------------------------
  # SSRF
  # ---------------------------------------------------------------------------
  - id: php-file-inclusion
    patterns:
      - pattern-either:
          - pattern: |
              include($INPUT)
          - pattern: |
              include_once($INPUT)
          - pattern: |
              require($INPUT)
          - pattern: |
              require_once($INPUT)
      - pattern-not: |
          include("...")
      - pattern-not: |
          include_once("...")
      - pattern-not: |
          require("...")
      - pattern-not: |
          require_once("...")
    message: >
      Dynamic file inclusion with user-controlled input enables Local/Remote
      File Inclusion (LFI/RFI). Use a whitelist of allowed files or map
      user input to predefined constants.
    severity: ERROR
    languages: [php]
    metadata:
      cwe: "CWE-98"
      owasp: "A03:2021 Injection"
      confidence: HIGH
      impact: CRITICAL
      category: security

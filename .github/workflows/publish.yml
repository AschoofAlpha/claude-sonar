name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Verify package version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          NAME=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['name'])")
          INIT=$(python -c "import pathlib,re; p=pathlib.Path('claude_shield/__version__.py'); t=p.read_text(encoding='utf-8') if p.exists() else pathlib.Path('claude_shield/__init__.py').read_text(encoding='utf-8'); print(re.search(r'__version__\s*=\s*[\"\\']([^\"\\']+)', t).group(1))")
          echo "tag=$TAG name=$NAME pyproject=$PKG __version__=$INIT"
          test "$TAG" = "$PKG"
          test "$TAG" = "$INIT"
          test "$NAME" = "claude-shield"
      - name: Build distributions
        run: python -m build
      - name: Check distributions
        run: twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true
